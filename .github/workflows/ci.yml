name: Node.js CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run automated tests
      run: npm test

    - name: Upload Mochawesome Report Artifact
      if: always() # Garante que o relatório seja salvo mesmo se algum teste falhar
      uses: actions/upload-artifact@v4
      with:
        name: api-mochawesome-report
        path: mochawesome-report/
