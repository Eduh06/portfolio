name: Node.js CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

# Permissões necessárias para que a pipeline publique na branch gh-pages
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run automated tests
      run: npm test

    - name: Prepare Mochawesome Report for GitHub Pages
      if: always()
      run: |
        # Renomeia o HTML para index.html para o GitHub Pages abrir diretamente o relatório
        mv mochawesome-report/api/api-tests.html mochawesome-report/api/index.html

    - name: Deploy Test Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./mochawesome-report/api
